name: v5 validation
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: python -m pip install -c constraints-tested.txt -e ".[dev]" build
      - name: Unit and local integration tests
        run: python -m pytest -q
      - name: Static checks
        run: python -m ruff check src tests tools --select E4,E7,E9,F
      - name: Browser checks (simulated QQ and temporary databases only)
        if: matrix.python == '3.11'
        run: |
          python tools/browser_qa.py
          python tools/qq_browser_qa.py
          python tools/desktop_browser_qa.py
      - name: Build distributions
        run: python -m build
      - name: Save synthetic QA reports
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-qa-${{ matrix.python }}
          path: qa/
          if-no-files-found: ignore
